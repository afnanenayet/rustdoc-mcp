[package]
name = "knowledge-mcp"
version.workspace = true
edition.workspace = true
description = "MCP server exposing the rust-knowledge retrieval engine"
license.workspace = true

[lib]
name = "knowledge_mcp"
path = "src/lib.rs"

[[bin]]
name = "knowledge-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
facet = { workspace = true }
figue = { workspace = true }
knowledge-core = { workspace = true }
knowledge-index = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
rmcp = { version = "3.2.0", features = ["client"] }
tempfile = "3"

[lints]
workspace = true
